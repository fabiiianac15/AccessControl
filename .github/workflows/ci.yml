name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Modelos faciales
        uses: actions/cache@v4
        with:
          path: data/models
          key: modelos-${{ hashFiles('src/portero/biometrics/engine.py') }}
      - run: uv run portero models
      - run: uv run pytest --cov=portero --cov-fail-under=85

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portero .
