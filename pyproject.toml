[project]
name = "portero"
version = "2.0.0"
description = "Control de acceso y asistencia con rostro o PIN, autoalojado en tu red local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<6",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
portero = "portero.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["models: requiere los modelos ONNX reales (se descargan con `portero models`)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RET", "C4"]
ignore = [
    "B008",  # Depends() en firmas: es el patrón de FastAPI
    "S101",  # assert en pruebas
    "S608",  # los SQL dinámicos solo interpolan fragmentos fijos; los valores van parametrizados
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
files = ["src/portero"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
